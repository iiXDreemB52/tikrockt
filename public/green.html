<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الأحداث · كروما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Readex+Pro:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --chroma:   #00ff00;
    --paper:    #F4EEE2;
    --paper-2:  #E7DDCA;
    --graphite: #16262B;
    --graphite-2: #566E75;
    --signal:   #C3301A;
    --gold:     #FFC53D;
    --live:     #1F9D62;
    --size: 26px;
    --display: 'Baloo Bhaijaan 2', system-ui, sans-serif;
    --body: 'Readex Pro', system-ui, sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--chroma);
    font-family: var(--body);
    color: var(--graphite);
    overflow: hidden;
  }

  .feed {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 9px;
    padding: 26px;
  }

  .row {
    position: relative;
    align-self: flex-start;
    max-width: 100%;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 18px 11px;
    border-radius: 4px;
    border-inline-start: 5px solid var(--graphite-2);
    background: var(--paper);
    font-size: var(--size);
    font-weight: 500;
    line-height: 1.3;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
    animation: pop .26s cubic-bezier(.2, 1, .3, 1.3) both;
  }

  .row__tag {
    flex: none;
    font-size: .42em;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--graphite-2);
  }
  .row__text { min-width: 0; overflow-wrap: anywhere; }
  .row__time {
    flex: none;
    margin-inline-start: auto;
    padding-inline-start: 14px;
    font-family: var(--mono);
    font-size: .42em;
    color: var(--graphite-2);
  }
  .no-time .row__time { display: none; }

  .row--join { border-inline-start-color: var(--live); }
  .row--join .row__tag { color: var(--live); }
  .row--round { border-inline-start-color: var(--paper-2); }
  .row--connection { border-inline-start-color: var(--graphite-2); }
  .row--error { border-inline-start-color: var(--signal); }
  .row--error .row__tag { color: var(--signal); }

  .row--winner {
    background: var(--gold);
    border-inline-start-color: var(--signal);
    padding: 15px 92px 17px 24px;
    font-family: var(--display);
    font-weight: 800;
    font-size: calc(var(--size) * 1.32);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .22);
  }
  .row--winner .row__tag { display: none; }
  .row--winner::after {
    content: 'فائز';
    position: absolute;
    inset-inline-end: 16px;
    top: 50%;
    padding: 1px 10px 3px;
    border: 3px solid var(--signal);
    border-radius: 4px;
    color: var(--signal);
    font-family: var(--display);
    font-size: .5em;
    letter-spacing: .05em;
    mix-blend-mode: multiply;
    transform: translateY(-50%) rotate(-12deg);
  }

  @keyframes pop {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* لوحة الضبط — تظهر بحركة الماوس فقط */
  .panel {
    position: fixed;
    top: 12px;
    inset-inline-start: 12px;
    z-index: 5;
    display: grid;
    gap: 9px;
    padding: 13px 15px;
    border-radius: 8px;
    background: #0F2A31;
    color: #F4EEE2;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  body.show-panel .panel { opacity: 1; pointer-events: auto; }
  .panel__row { display: flex; align-items: center; gap: 8px; }
  .panel label { color: #7E97A0; }
  .panel button {
    border: 1px solid #1D4952;
    background: transparent;
    color: #F4EEE2;
    border-radius: 4px;
    padding: 4px 11px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  .panel button.is-on { border-color: var(--gold); color: var(--gold); }
  .panel input[type="range"] { accent-color: var(--gold); width: 108px; }
  .swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #2C6270; cursor: pointer; }

  .hint {
    position: fixed;
    bottom: 10px;
    inset-inline-start: 14px;
    z-index: 4;
    margin: 0;
    font-size: 11px;
    font-family: var(--mono);
    color: rgba(22, 38, 43, .38);
  }
</style>
</head>
<body>

<div class="feed" id="feed"></div>

<div class="panel" id="panel">
  <div class="panel__row">
    <label>لون الخلفية</label>
    <span class="swatch" data-color="#00ff00" style="background:#00ff00"></span>
    <span class="swatch" data-color="#0000ff" style="background:#0000ff"></span>
    <span class="swatch" data-color="#ff00ff" style="background:#ff00ff"></span>
    <span class="swatch" data-color="#0B1E24" style="background:#0B1E24"></span>
  </div>
  <div class="panel__row">
    <label>حجم الخط</label>
    <input type="range" id="size" min="16" max="60" step="2" value="26">
  </div>
  <div class="panel__row">
    <label>يعرض</label>
    <button data-filter="all" class="is-on">الكل</button>
    <button data-filter="join">انضمام</button>
    <button data-filter="winner">فائزون</button>
  </div>
  <div class="panel__row">
    <label>الوقت</label>
    <button id="toggle-time" class="is-on">ظاهر</button>
    <label>الأسطر</label>
    <input type="range" id="rows" min="3" max="25" step="1" value="10">
  </div>
</div>

<p class="hint">حرّك الماوس لإظهار الضبط · ?color=00ff00&size=30&filter=join&rows=8&time=0</p>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

const params = new URLSearchParams(location.search);
const feed = document.getElementById('feed');

const TAG = { join: 'انضمام', winner: 'فوز', round: 'جولة', connection: 'اتصال', system: 'نظام', error: 'خطأ' };

let filter = params.get('filter') || 'all';
let maxRows = Number(params.get('rows')) || 10;

if (params.get('color')) document.documentElement.style.setProperty('--chroma', `#${params.get('color').replace('#', '')}`);
if (params.get('size')) document.documentElement.style.setProperty('--size', `${params.get('size')}px`);
if (params.get('time') === '0') document.body.classList.add('no-time');

function keep(type) {
  if (filter === 'all') return type !== 'system';
  return type === filter;
}

function rowNode(event) {
  const row = document.createElement('div');
  row.className = `row row--${event.type}`;
  row.innerHTML = '<span class="row__tag"></span><span class="row__text"></span><time class="row__time"></time>';
  row.querySelector('.row__tag').textContent = TAG[event.type] || '';
  row.querySelector('.row__text').textContent = event.text;
  row.querySelector('.row__time').textContent =
    new Date(event.at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  return row;
}

function addEvent(event) {
  if (!keep(event.type)) return;
  feed.appendChild(rowNode(event));
  while (feed.childElementCount > maxRows) feed.firstElementChild.remove();
}

function renderAll(list) {
  feed.replaceChildren();
  list.filter((e) => keep(e.type)).slice(-maxRows).forEach((e) => feed.appendChild(rowNode(e)));
}

let allEvents = [];
const socket = io();

socket.on('state', (s) => { allEvents = s.events || []; renderAll(allEvents); });
socket.on('event', (event) => { allEvents.push(event); addEvent(event); });
socket.on('events:clear', () => { allEvents = []; feed.replaceChildren(); });

/* ── لوحة الضبط ── */

let panelTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-panel');
  clearTimeout(panelTimer);
  panelTimer = setTimeout(() => document.body.classList.remove('show-panel'), 2600);
});

document.querySelectorAll('.swatch').forEach((swatch) => {
  swatch.addEventListener('click', () => {
    document.documentElement.style.setProperty('--chroma', swatch.dataset.color);
  });
});

document.getElementById('size').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--size', `${e.target.value}px`);
});

document.getElementById('rows').addEventListener('input', (e) => {
  maxRows = Number(e.target.value);
  renderAll(allEvents);
});

document.querySelectorAll('[data-filter]').forEach((button) => {
  button.addEventListener('click', () => {
    filter = button.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((b) => b.classList.toggle('is-on', b === button));
    renderAll(allEvents);
  });
});

const timeButton = document.getElementById('toggle-time');
timeButton.addEventListener('click', () => {
  const hidden = document.body.classList.toggle('no-time');
  timeButton.classList.toggle('is-on', !hidden);
  timeButton.textContent = hidden ? 'مخفي' : 'ظاهر';
});
</script>
</body>
</html>
