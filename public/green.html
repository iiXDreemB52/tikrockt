<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الأحداث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  .feed {
    height: 100%;
    width: var(--feed-width, 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    padding: 20px;
  }
  body[data-dir="up"] .feed { flex-direction: column-reverse; justify-content: flex-end; }

  .row {
    position: relative;
    align-self: flex-start;
    max-width: 100%;
    display: flex;
    align-items: baseline;
    gap: 11px;
    padding: 9px 16px 10px;
    border-radius: 5px;
    border-inline-start: 5px solid var(--graphite-2);
    background: var(--paper);
    filter: drop-shadow(var(--lift));
    font-size: var(--size);
    font-weight: 500;
    line-height: 1.3;
    animation: pop-in .26s cubic-bezier(.2, 1, .3, 1.3) both;
  }
  .row.is-fading { animation: fade-out .6s ease forwards; }
  @keyframes fade-out { to { opacity: 0; transform: translateY(-6px) scale(.98); } }

  .row__tag {
    flex: none;
    font-size: .4em;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--graphite-2);
  }
  .row__text { min-width: 0; overflow-wrap: anywhere; }
  .row__time {
    flex: none;
    margin-inline-start: auto;
    padding-inline-start: 14px;
    font-family: var(--mono);
    font-size: .4em;
    color: var(--graphite-2);
  }
  body.no-time .row__time { display: none; }

  .row--join { border-inline-start-color: var(--live); }
  .row--join .row__tag { color: var(--live); }
  .row--round { border-inline-start-color: var(--gold); }
  .row--connection { border-inline-start-color: var(--graphite-2); }
  .row--error { border-inline-start-color: var(--signal); }
  .row--error .row__tag { color: var(--signal); }

  .row--winner {
    border-inline-start-color: var(--signal);
    background: var(--gold);
    padding: 13px 84px 15px 22px;
    font-family: var(--display);
    font-weight: 800;
    font-size: calc(var(--size) * 1.26);
  }
  .row--winner .row__tag { display: none; }
  .row--winner .stamp {
    top: 50%;
    inset-inline-end: 14px;
    font-size: .48em;
    border-width: 4px;
    transform: translateY(-50%) rotate(-12deg);
  }
</style>
</head>
<body>

<div class="feed" id="feed"></div>

<button class="audio-note" id="audio-note" hidden>فعّل الصوت</button>

<div class="panel">
  <div class="panel__row">
    <span class="panel__label">الخلفية</span>
    <button class="swatch swatch--clear" data-bg-option="transparent" title="بدون خلفية"></button>
    <button class="swatch" data-bg-option="green" style="background:#00ff00" title="أخضر"></button>
    <button class="swatch" data-bg-option="blue" style="background:#0000ff" title="أزرق"></button>
    <button class="swatch" data-bg-option="magenta" style="background:#ff00ff" title="بنفسجي"></button>
    <button class="swatch" data-bg-option="dark" style="background:#0F0F0F" title="لوح داكن"></button>
  </div>

  <div class="panel__row">
    <span class="panel__label">الحجم</span>
    <input type="range" id="p-size" min="12" max="52" step="2">
    <span class="panel__hint" id="p-size-view">22</span>
    <span class="panel__label">العرض</span>
    <input type="range" id="p-width" min="30" max="100" step="5">
    <span class="panel__hint" id="p-width-view">١٠٠٪</span>
  </div>

  <div class="panel__row">
    <span class="panel__label">الأسطر</span>
    <input type="range" id="p-rows" min="1" max="20" step="1">
    <span class="panel__hint" id="p-rows-view">٨</span>
    <span class="panel__label">يختفي بعد</span>
    <input type="range" id="p-fade" min="0" max="60" step="5">
    <span class="panel__hint" id="p-fade-view">لا يختفي</span>
  </div>

  <div class="panel__row">
    <span class="panel__label">يعرض</span>
    <button data-filter="all">الكل</button>
    <button data-filter="join">انضمام</button>
    <button data-filter="winner">فائزون</button>
    <button data-dir="down">الجديد تحت</button>
    <button data-dir="up">الجديد فوق</button>
    <button id="p-time">الوقت</button>
  </div>

  <div class="panel__row">
    <span class="panel__hint">V يفتح ويغلق هذه اللوحة</span>
    <button data-panel-close style="margin-inline-start:auto">إغلاق</button>
  </div>

  <p class="panel__hint">?bg=transparent&size=24&rows=6&fade=15&filter=join&dir=up&width=60&time=0</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="overlay.js"></script>
<script>
'use strict';

const socket = io({ query: { room: Overlay.room() } });
const feed = document.getElementById('feed');
const TAG = { join: 'انضمام', winner: 'فوز', round: 'جولة', connection: 'اتصال', system: 'نظام', error: 'خطأ' };

let events = [];

const prefs = Overlay.init({
  screen: 'events',
  socket,
  onChange: applyAll,
  defaults: {
    bg: 'transparent',
    size: 22,
    rows: 8,
    fade: 0,
    filter: 'all',
    dir: 'down',
    width: 100,
    time: true,
  },
});

function markGroup(selector, attribute, value) {
  document.querySelectorAll(selector).forEach((button) => {
    button.classList.toggle('is-on', button.dataset[attribute] === String(value));
  });
}

function applyAll(current) {
  Overlay.applyBackground(current.bg);
  Overlay.applySize(current.size);
  document.documentElement.style.setProperty('--feed-width', `${current.width}%`);
  document.body.dataset.dir = current.dir;
  document.body.classList.toggle('no-time', !current.time);

  markGroup('[data-filter]', 'filter', current.filter);
  markGroup('[data-dir]', 'dir', current.dir);

  document.getElementById('p-size').value = current.size;
  document.getElementById('p-size-view').textContent = current.size;
  document.getElementById('p-width').value = current.width;
  document.getElementById('p-width-view').textContent = `${Overlay.arabicNumber(current.width)}٪`;
  document.getElementById('p-rows').value = current.rows;
  document.getElementById('p-rows-view').textContent = Overlay.arabicNumber(current.rows);
  document.getElementById('p-fade').value = current.fade;
  document.getElementById('p-fade-view').textContent = current.fade > 0 ? `${Overlay.arabicNumber(current.fade)}ث` : 'لا يختفي';

  Overlay.toggleButton(document.getElementById('p-time'), current.time, 'الوقت', 'بدون وقت');

  renderAll();
}

Overlay.setMuted(true);
Overlay.bindAudioNote(document.getElementById('audio-note'));
Overlay.keyPanel();

/* ═══ الأسطر ═══ */

function keep(type) {
  const filter = Overlay.get('filter');
  if (filter === 'all') return type !== 'system';
  return type === filter;
}

function rowNode(event) {
  const row = document.createElement('div');
  row.className = `row row--${event.type}`;
  row.innerHTML = '<span class="row__tag"></span><span class="row__text"></span><time class="row__time"></time>';
  row.querySelector('.row__tag').textContent = TAG[event.type] || '';
  row.querySelector('.row__text').textContent = event.text;
  row.querySelector('.row__time').textContent =
    new Date(event.at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

  if (event.type === 'winner') {
    const stamp = document.createElement('span');
    stamp.className = 'stamp';
    stamp.textContent = 'فائز';
    row.appendChild(stamp);
  }

  const seconds = Overlay.get('fade');
  if (seconds) row.dataset.fadeAt = String(Date.now() + seconds * 1000);
  return row;
}

setInterval(() => {
  if (!Overlay.get('fade')) return;
  const now = Date.now();
  [...feed.children].forEach((row) => {
    const at = Number(row.dataset.fadeAt || 0);
    if (at && now >= at && !row.classList.contains('is-fading')) {
      row.classList.add('is-fading');
      setTimeout(() => row.remove(), 620);
    }
  });
}, 500);

function trim() {
  const max = Overlay.get('rows');
  while (feed.childElementCount > max) {
    const drop = Overlay.get('dir') === 'up' ? feed.lastElementChild : feed.firstElementChild;
    drop.remove();
  }
}

function addEvent(event) {
  if (!keep(event.type)) return;
  const node = rowNode(event);
  if (Overlay.get('dir') === 'up') feed.prepend(node); else feed.appendChild(node);
  trim();
}

function renderAll() {
  feed.replaceChildren();
  const list = events.filter((e) => keep(e.type)).slice(-Overlay.get('rows'));
  const ordered = Overlay.get('dir') === 'up' ? [...list].reverse() : list;
  ordered.forEach((e) => feed.appendChild(rowNode(e)));
}

/* ═══ الاتصال ═══ */

socket.on('state', (s) => {
  if (s.config && s.config.overlay) Overlay.fromServer(s.config.overlay.events);
  events = s.events || [];
  renderAll();
});
socket.on('event', (event) => { events.push(event); addEvent(event); });
socket.on('events:clear', () => { events = []; feed.replaceChildren(); });

/* ═══ أزرار اللوحة ═══ */

document.querySelectorAll('[data-bg-option]').forEach((b) => b.addEventListener('click', () => Overlay.set('bg', b.dataset.bgOption)));
document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => Overlay.set('filter', b.dataset.filter)));
document.querySelectorAll('[data-dir]').forEach((b) => b.addEventListener('click', () => Overlay.set('dir', b.dataset.dir)));

document.getElementById('p-size').addEventListener('input', (e) => Overlay.set('size', Number(e.target.value)));
document.getElementById('p-width').addEventListener('input', (e) => Overlay.set('width', Number(e.target.value)));
document.getElementById('p-rows').addEventListener('input', (e) => Overlay.set('rows', Number(e.target.value)));
document.getElementById('p-fade').addEventListener('input', (e) => Overlay.set('fade', Number(e.target.value)));
document.getElementById('p-time').addEventListener('click', () => Overlay.set('time', !Overlay.get('time')));

applyAll(prefs);
</script>
</body>
</html>
