<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🟩 شاشة الأحداث الخضراء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --chroma: #00ff00;
    --ink: #06210c;
    --card: rgba(255, 255, 255, .92);
    --size: 26px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--chroma);
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  .feed {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    padding: 24px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    max-width: 100%;
    padding: 10px 18px;
    border-radius: 14px;
    background: var(--card);
    border-inline-start: 6px solid #1f7a3a;
    font-size: var(--size);
    font-weight: 600;
    line-height: 1.25;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
    animation: pop .28s cubic-bezier(.2, .9, .3, 1.35) both;
  }
  .row__icon { font-size: 1.1em; flex: none; }
  .row__text { min-width: 0; overflow-wrap: anywhere; }
  .row__time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .55em;
    opacity: .55;
    margin-inline-start: auto;
    flex: none;
  }
  .no-time .row__time { display: none; }

  .row--winner {
    background: #ffd45e;
    border-inline-start-color: #a05a00;
    font-family: 'Reem Kufi', sans-serif;
    font-size: calc(var(--size) * 1.4);
    padding: 16px 26px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .18);
  }
  .row--round { border-inline-start-color: #6b3fd4; }
  .row--connection { border-inline-start-color: #0a6fa8; }
  .row--error { background: #ffd0d8; border-inline-start-color: #c01c3c; }
  .row--system { border-inline-start-color: #55606e; }

  @keyframes pop {
    from { transform: translateY(14px) scale(.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* لوحة الضبط — تختفي تلقائيًا وما تظهر في البث إلا لما تحرك الماوس */
  .panel {
    position: fixed;
    top: 12px;
    inset-inline-start: 12px;
    display: grid;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(10, 14, 32, .92);
    color: #eaf1ff;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 5;
  }
  body.show-panel .panel { opacity: 1; pointer-events: auto; }
  .panel__row { display: flex; align-items: center; gap: 8px; }
  .panel label { color: #93a1c9; }
  .panel button {
    border: 1px solid #33447f;
    background: transparent;
    color: #eaf1ff;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .panel button.is-on { border-color: #33e1ff; color: #33e1ff; }
  .panel input[type="range"] { accent-color: #33e1ff; width: 110px; }
  .swatch { width: 20px; height: 20px; border-radius: 6px; border: 1px solid #33447f; cursor: pointer; }
  .hint { position: fixed; bottom: 10px; inset-inline-start: 12px; font-size: 11px; color: rgba(6,33,12,.45); z-index: 4; }
</style>
</head>
<body>

<div class="feed" id="feed"></div>

<div class="panel" id="panel">
  <div class="panel__row">
    <label>لون الخلفية</label>
    <span class="swatch" data-color="#00ff00" style="background:#00ff00"></span>
    <span class="swatch" data-color="#0000ff" style="background:#0000ff"></span>
    <span class="swatch" data-color="#ff00ff" style="background:#ff00ff"></span>
    <span class="swatch" data-color="#000000" style="background:#000"></span>
  </div>
  <div class="panel__row">
    <label>حجم الخط</label>
    <input type="range" id="size" min="16" max="60" step="2" value="26">
  </div>
  <div class="panel__row">
    <label>يعرض</label>
    <button data-filter="all" class="is-on">الكل</button>
    <button data-filter="join">انضمام</button>
    <button data-filter="winner">فائزون</button>
  </div>
  <div class="panel__row">
    <label>الوقت</label>
    <button id="toggle-time" class="is-on">ظاهر</button>
    <label>عدد الأسطر</label>
    <input type="range" id="rows" min="3" max="25" step="1" value="10">
  </div>
</div>

<p class="hint">حرّك الماوس لإظهار لوحة الضبط · الرابط يقبل ‎?color=00ff00&size=30&filter=join&rows=8</p>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

const params = new URLSearchParams(location.search);
const feed = document.getElementById('feed');

const ICON = { join: '👤', winner: '🏆', round: '⏱️', connection: '📡', system: 'ℹ️', error: '⚠️' };

let filter = params.get('filter') || 'all';
let maxRows = Number(params.get('rows')) || 10;

if (params.get('color')) document.documentElement.style.setProperty('--chroma', `#${params.get('color').replace('#', '')}`);
if (params.get('size')) document.documentElement.style.setProperty('--size', `${params.get('size')}px`);
if (params.get('time') === '0') document.body.classList.add('no-time');

function keep(type) {
  if (filter === 'all') return type !== 'system';
  return type === filter;
}

function rowNode(event) {
  const row = document.createElement('div');
  row.className = `row row--${event.type}`;
  row.innerHTML = '<span class="row__icon"></span><span class="row__text"></span><time class="row__time"></time>';
  row.querySelector('.row__icon').textContent = ICON[event.type] || '·';
  row.querySelector('.row__text').textContent = event.text;
  row.querySelector('.row__time').textContent =
    new Date(event.at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  return row;
}

function addEvent(event) {
  if (!keep(event.type)) return;
  feed.appendChild(rowNode(event));
  while (feed.childElementCount > maxRows) feed.firstElementChild.remove();
}

function renderAll(list) {
  feed.replaceChildren();
  list.filter((e) => keep(e.type)).slice(-maxRows).forEach((e) => feed.appendChild(rowNode(e)));
}

let allEvents = [];
const socket = io();

socket.on('state', (s) => { allEvents = s.events || []; renderAll(allEvents); });
socket.on('event', (event) => { allEvents.push(event); addEvent(event); });
socket.on('events:clear', () => { allEvents = []; feed.replaceChildren(); });

/* ── لوحة الضبط ── */

let panelTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-panel');
  clearTimeout(panelTimer);
  panelTimer = setTimeout(() => document.body.classList.remove('show-panel'), 2600);
});

document.querySelectorAll('.swatch').forEach((swatch) => {
  swatch.addEventListener('click', () => {
    document.documentElement.style.setProperty('--chroma', swatch.dataset.color);
  });
});

document.getElementById('size').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--size', `${e.target.value}px`);
});

document.getElementById('rows').addEventListener('input', (e) => {
  maxRows = Number(e.target.value);
  renderAll(allEvents);
});

document.querySelectorAll('[data-filter]').forEach((button) => {
  button.addEventListener('click', () => {
    filter = button.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((b) => b.classList.toggle('is-on', b === button));
    renderAll(allEvents);
  });
});

const timeButton = document.getElementById('toggle-time');
timeButton.addEventListener('click', () => {
  const hidden = document.body.classList.toggle('no-time');
  timeButton.classList.toggle('is-on', !hidden);
  timeButton.textContent = hidden ? 'مخفي' : 'ظاهر';
});
</script>
</body>
</html>
