<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سحب البث المباشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ الشاشة الرئيسية ══ -->
<main class="stage" id="stage-main">

  <aside class="rail">
    <header class="rail__head">
      <h1 class="wordmark">سحب<span>البث</span></h1>
      <p class="rail__sub">تذكرة لكل من يكتب الكلمة</p>
    </header>

    <section class="panel">
      <label class="field">
        <span class="field__label">حساب البث</span>
        <div class="field__wrap">
          <span class="field__at">@</span>
          <input id="username" type="text" placeholder="اسم المستخدم" autocomplete="off" spellcheck="false" dir="ltr">
        </div>
      </label>

      <div class="accounts" id="accounts" hidden></div>

      <div class="btn-row">
        <button class="btn btn--go" id="btn-start">تشغيل الاتصال</button>
        <button class="btn btn--stop" id="btn-stop" disabled>إيقاف</button>
      </div>

      <div class="status" id="status" data-state="disconnected">
        <span class="status__dot"></span>
        <span class="status__text">غير متصل</span>
        <button class="linkish status__check" id="btn-check">تحقق من البث</button>
      </div>
    </section>

    <section class="panel">
      <label class="field">
        <span class="field__label">كلمة الدخول</span>
        <div class="field__wrap">
          <input id="keyword" type="text" value="دخول" maxlength="40" autocomplete="off">
        </div>
      </label>

      <div class="segmented" role="radiogroup" aria-label="طريقة المطابقة">
        <button class="seg is-on" data-mode="exact" role="radio" aria-checked="true">مطابقة تامة</button>
        <button class="seg" data-mode="contains" role="radio" aria-checked="false">تحتوي الكلمة</button>
      </div>

      <label class="toggle">
        <input type="checkbox" id="exclude" checked>
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__text">استبعاد الفائز من السحوبات القادمة</span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="sound" checked>
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__text">المؤثر الصوتي عند السحب</span>
      </label>
    </section>

    <section class="panel panel--tight">
      <div class="btn-row">
        <button class="btn btn--ghost" id="btn-clear">مسح القائمة</button>
        <a class="btn btn--ghost" id="btn-csv" href="/api/participants.csv" download>تصدير CSV</a>
      </div>
    </section>

    <section class="panel panel--history">
      <div class="panel__head">
        <h2>آخر الفائزين</h2>
        <button class="linkish" id="btn-history-clear">مسح</button>
      </div>
      <ol class="history" id="history"><li class="history__empty">لا فائزين بعد.</li></ol>
    </section>

    <section class="log" id="log" aria-live="polite"></section>
  </aside>

  <section class="wall">
    <header class="wall__head">
      <div class="counter">
        <span class="counter__num" id="count">٠</span>
        <span class="counter__label">مشارك مسجَّل</span>
      </div>
      <button class="draw-btn" id="btn-draw">
        <span class="draw-btn__text">سحب فائز</span>
        <span class="draw-btn__hint">اقطع التذكرة</span>
      </button>
    </header>

    <div class="tickets" id="tickets"></div>

    <div class="empty" id="empty">
      <div class="empty__ticket"></div>
      <p class="empty__title">لا توجد تذاكر بعد</p>
      <p class="empty__body">شغّل الاتصال، ثم اطلب من المشاهدين كتابة <b id="empty-keyword">دخول</b> في الشات. كل اسم يظهر هنا مرة واحدة فقط.</p>
    </div>
  </section>
</main>

<!-- ══ شاشة الفائز ══ -->
<main class="winner-stage" id="stage-winner" hidden>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <div class="winner-card">
    <p class="winner-eyebrow">التذكرة الفائزة</p>
    <div class="winner-id">
      <div class="avatar avatar--xl" id="w-avatar"></div>
      <div>
        <h2 class="winner-name" id="w-name">—</h2>
        <p class="winner-handle" id="w-handle"></p>
      </div>
    </div>
    <div class="winner-actions">
      <button class="btn btn--go" id="btn-redraw">إعادة السحب</button>
      <button class="btn btn--ghost" id="btn-back">رجوع للقائمة</button>
    </div>
  </div>

  <div class="thread">
    <header class="thread__head">
      <span class="thread__title">رسائل الفائز مباشرة</span>
      <span class="thread__live"><i></i>يتابع</span>
    </header>
    <div class="thread__body" id="thread"></div>
    <p class="thread__wait" id="thread-wait">في انتظار أول رسالة من الفائز…</p>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
